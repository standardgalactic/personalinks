[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spherepop"
version = "0.1.0"
description = "Spherepop micro-lab implementing formal semantics with append-only history"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Spherepop Contributors"}
]
keywords = ["formal-semantics", "history", "computation", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# No runtime dependencies - core spherepop is pure Python stdlib
dependencies = []

[project.optional-dependencies]
# Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.98.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
    "pdoc3>=0.10.0",
]

# CLI interface (Phase 7)
cli = [
    "click>=8.1.0",
]

# All optional dependencies
all = [
    "spherepop[dev,cli]",
]

[project.urls]
Homepage = "https://github.com/standardgalactic/personalinks"
Repository = "https://github.com/standardgalactic/personalinks"
Issues = "https://github.com/standardgalactic/personalinks/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "experimental: marks tests of provisional semantics (see THEORY_STATUS.md)",
]
# Minimum Python version for f-string and union syntax
minversion = "3.12"

[tool.coverage.run]
branch = true
source = ["spherepop"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    # Experiment directories - they're tested by running them, not by pytest
    "*/spherepop/[0-9]*-*/",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]
show_missing = true
skip_covered = false
precision = 2

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
# Tests can be slightly less strict
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (we use this pattern)
    "B904",  # use raise from (sometimes we want to hide the original exception)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "E501"]  # Tests can have unused args and long lines
"spherepop/[0-9]*-*/*" = ["E501", "F401", "F841"]  # Experiments are exploratory

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["spherepop"]
